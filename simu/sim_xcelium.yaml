- tool: xcelium
  compile:
    count_comp   : "1"
    work_lib     : "work"
    svlog_option : "-errormax 1 -nowarn UEXPSC -nowarn SPDUSD -nowarn NOINUF -nowarn FUNTSK +incdir+${PROJECT_DIR} -uvm"
    svlog_source : "${PROJECT_DIR}/top/rtl/tb_top.sv"
    yaml_lists   : "${PROJECT_DIR}/fpu_common/fpu_common_xcelium.yaml
                    ${PROJECT_DIR}/simu/sim_verilog_xcelium.yaml
                    ${PROJECT_DIR}/simu/sim_sverilog_xcelium.yaml
                    ${PROJECT_DIR}/tb_xcelium.yaml
                    ${PROJECT_DIR}/fpu_agent/fpu_agent_xcelium.yaml
                    ${PROJECT_DIR}/ref_model_csim/fpu_refmodel_xcelium.yaml
                    ${PROJECT_DIR}/env/fpu_env_xcelium.yaml
                    ${PROJECT_DIR}/tests/fpu_test_xcelium.yaml "
    elab_option  :  "-errormax 1 -nowarn CUVUKP +incdir+${PROJECT_DIR} -uvm"
    top_entity   :  "top"
  sim:
    sim_option   : ""

